<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innovation Day Prompt Builder</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #fffdf8;
        --ink: #1f2a30;
        --muted: #5a666d;
        --accent: #2f6f57;
        --accent-hover: #235541;
        --border: #d7d0c3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 20% 20%, #efe7d7 0%, var(--bg) 45%),
          radial-gradient(circle at 80% 85%, #e2efe9 0%, var(--bg) 50%);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(780px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(19, 27, 31, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem);
      }

      p.helper {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .field {
        margin-bottom: 16px;
      }

      .field label.title {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        color: var(--ink);
        background: #ffffff;
      }

      .radio-group {
        display: grid;
        gap: 8px;
      }

      .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-hover);
      }

      .output {
        margin-top: 22px;
        border-top: 1px solid var(--border);
        padding-top: 18px;
      }

      .output h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
      }

      .output-actions {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .copy-status {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      #promptOutput {
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Prompt Builder</h1>
      <p class="helper">Fill out the fields and click Create prompt.</p>

      <form id="promptForm">
        <div style="margin-bottom: 16px">
          <button id="clearButton" type="button">Clear fields</button>
        </div>
        <div class="field">
          <label class="title" for="character">Field 1: Hero</label>
          <input id="character" name="character" type="text" required />
        </div>

        <div class="field">
          <label class="title" for="heroDescription">Field 2: Hero description</label>
          <input id="heroDescription" name="heroDescription" type="text" required />
        </div>

        <div class="field">
          <span class="title" style="display: block; font-weight: 700; margin-bottom: 8px"
            >Field 3: Story</span
          >
          <div class="radio-group" role="radiogroup" aria-label="Story selection">
            <label class="radio-option">
              <input type="radio" name="story" value="return" checked />
              <span>Return to office</span>
            </label>
            <div
              id="vibeField"
              class="field"
              style="margin: 8px 0 8px 24px; padding-left: 12px; border-left: 2px solid var(--border)"
            >
              <span class="title" style="display: block; font-weight: 700; margin-bottom: 8px"
                >When the vibe in the office becomes overwhelming…</span
              >
              <div class="radio-group" role="radiogroup" aria-label="Vibe selection">
                <label class="radio-option">
                  <input type="radio" name="vibe" value="and the printer starts shooting papers" checked />
                  <span>and the printer starts shooting papers.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="vibe" value="and their computer starts to smoke" />
                  <span>and their computer starts to smoke.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="vibe" value="and their chair breaks from underneath them" />
                  <span>and their chair breaks from underneath them.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="vibe" value="and there are no more donuts left" />
                  <span>and there are no more donuts left.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="vibe" value="and all the coffee is gone" />
                  <span>and all the coffee is gone.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="vibe" value="" />
                  <span>None</span>
                </label>
              </div>
            </div>
            <label class="radio-option">
              <input type="radio" name="story" value="home" />
              <span>Finding your way home</span>
            </label>
            <div
              id="locationField"
              class="field"
              style="margin: 8px 0 8px 24px; padding-left: 12px; border-left: 2px solid var(--border)"
            >
              <span class="title" style="display: block; font-weight: 700; margin-bottom: 8px"
                >through a vast, fog-covered landscape of crumbling stone archways and overgrown paths…</span
              >
              <div class="radio-group" role="radiogroup" aria-label="Location selection">
                <label class="radio-option">
                  <input type="radio" name="location" value="on Mars" checked />
                  <span>on Mars.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="location" value="in the jungle" />
                  <span>in the jungle.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="location" value="in an abandoned old west town" />
                  <span>in an abandoned old west town.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="location" value="underwater" />
                  <span>underwater.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="location" value="in ancient desert" />
                  <span>in ancient desert.</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="location" value="" />
                  <span>None</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="title" for="style">Field 4: Style</label>
          <input id="style" name="style" type="text" required />
        </div>

        <div class="field">
          <label class="title" for="audio">Field 5: Audio considerations</label>
          <input id="audio" name="audio" type="text" required />
        </div>

        <button type="submit">Create prompt</button>
      </form>

      <section class="output" aria-live="polite">
        <h2>Generated prompt</h2>
        <p id="promptOutput">Your generated prompt will appear here.</p>
        <div class="output-actions">
          <button id="copyButton" type="button">Copy</button>
          <p id="copyStatus" class="copy-status"></p>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("promptForm");
      const output = document.getElementById("promptOutput");
      const copyButton = document.getElementById("copyButton");
      const copyStatus = document.getElementById("copyStatus");
      const clearButton = document.getElementById("clearButton");
      const vibeField = document.getElementById("vibeField");
      const locationField = document.getElementById("locationField");

      function updateVibeVisibility() {
        const story = form.elements.story.value;
        vibeField.style.display = story === "return" ? "" : "none";
        locationField.style.display = story === "home" ? "" : "none";
      }

      updateVibeVisibility();
      form.elements.story.forEach((radio) => {
        radio.addEventListener("change", updateVibeVisibility);
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const character = document.getElementById("character").value.trim();
        const heroDescription = document.getElementById("heroDescription").value.trim();
        const style = document.getElementById("style").value.trim();
        const audio = document.getElementById("audio").value.trim();
        const selectedStory = form.elements.story.value;
        const selectedVibe = form.elements.vibe.value;
        const selectedLocation = form.elements.location.value;

        const article = /^[aeiou]/i.test(character) ? "an" : "a";
        const heroIntro = `Our hero is ${article} ${character}. The following describes our hero. ${heroDescription}.`;

        let storyPrompt = "";

        if (selectedStory === "return") {
          const vibeClause = selectedVibe ? `${selectedVibe}, ` : "";
          storyPrompt = `${character} exists in a world where everyone is called back to the office. When the office vibe becomes overwhelming, ${vibeClause}everything changes. But through one small, unexpected moment of connection at the office, ${character} surprisingly and happily discovers home isn't a place — it's possible anywhere.\n\nVisual style: ${style}. Emotionally resonant. `;
        } else {
          const locationClause = selectedLocation ? ` ${selectedLocation}` : "";
          storyPrompt = `Our hero, ${character}, defeatedly trudges alone through a vast, fog-covered landscape of crumbling stone archways and overgrown paths${locationClause} — clutching a bundle of belongings. A sudden wind tears the bundle away, scattering everything into the mist — except one small precious object (like a snow globe, a photograph, a small lantern, a worn compass) that rolls to a stop at our hero’s feet, glowing faintly from within. They cradle it gently and look up with a sense of hope — the fog parts to reveal a single lantern-lit path winding toward a warm, distant light on the horizon.\n\nVisual style: ${style}. Dusk palette — deep indigo, fog grey, and warm amber. Continuous fluid motion. Emotionally resonant. No text on screen.`;
        }

        const prompt = `${heroIntro}\n\n${storyPrompt}\n\nAudio considerations: ${audio}.`;

        output.textContent = prompt;
        copyStatus.textContent = "";
      });

      clearButton.addEventListener("click", function () {
        form.reset();
        updateVibeVisibility();
        output.textContent = "Your generated prompt will appear here.";
        copyStatus.textContent = "";
      });

      copyButton.addEventListener("click", async function () {
        const textToCopy = output.textContent.trim();

        if (!textToCopy || textToCopy === "Your generated prompt will appear here.") {
          copyStatus.textContent = "Create a prompt first.";
          return;
        }

        try {
          await navigator.clipboard.writeText(textToCopy);
          copyStatus.textContent = "Copied to clipboard.";
        } catch (error) {
          copyStatus.textContent = "Could not copy automatically. Please copy manually.";
        }
      });
    </script>
  </body>
</html>
